services:
  beinv:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beinv
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      - BIND=0.0.0.0:8080
      - WEB_DIST=/app/web/dist
      - RUST_LOG=info
      - BEINV_VIDEO_CACHE=/tmp/beinv-yt
    # No volumes: API caches live in memory and rebuild from upstream on start.
    # Remuxed La Liga mp4s sit in BEINV_VIDEO_CACHE (tmpfs, lost on recreate).
